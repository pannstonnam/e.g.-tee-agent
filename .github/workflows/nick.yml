name: Nick AI Agent

on:
  schedule:
    # 18:00 น. เวลาไทย (UTC+7) = 11:00 UTC ทุกวัน
    - cron: '0 11 * * *'
  workflow_dispatch:  # ให้กดรันเองได้จากแท็บ Actions ด้วย

jobs:
  run-nick-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Nick Agent
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ใส่ secret ที่ tee_agent.py ใช้สำหรับ Google Drive Service Account
          # ที่นี่ด้วย (ชื่อตัวแปรขึ้นกับโค้ดใน tee_agent.py ของคุณ) เช่น:
          # GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python nick_agent.py
